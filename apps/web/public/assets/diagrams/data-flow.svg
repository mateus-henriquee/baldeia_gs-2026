<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1010" width="1480" height="1010" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif"><title id="t">Diagrama de fluxo de dados (DFD) da Baldeia</title><desc id="d">Entidades externas, processos, depósitos de dados, limites de confiança e fluxos com dados pessoais.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#101418"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF4D2E"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6270"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F1F2F4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#D5D8DE" stroke-width="3"/></pattern></defs><rect width="1480" height="1010" fill="#F6F3EC"/><text x="40" y="52" font-size="26" font-weight="700" fill="#101418" text-anchor="start">Fluxo de dados (DFD) e limites de confiança</text><text x="40" y="80" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">Retângulos = entidades externas · cantos arredondados = processos · barras = depósitos · tracejado = limite de confiança · ● DP = dado pessoal</text><rect x="30" y="120" width="330" height="820" rx="22" fill="none" stroke="#2B59C3" stroke-width="2" stroke-dasharray="10 7"/><rect x="50" y="108" width="187.2" height="24" rx="12" fill="#F6F3EC"/><text x="60" y="125" font-size="12.5" font-weight="700" fill="#2B59C3" text-anchor="start">Dispositivo do usuário</text><rect x="400" y="120" width="720" height="820" rx="22" fill="none" stroke="#101418" stroke-width="2" stroke-dasharray="10 7"/><rect x="420" y="108" width="286.0" height="24" rx="12" fill="#F6F3EC"/><text x="430" y="125" font-size="12.5" font-weight="700" fill="#101418" text-anchor="start">Servidor Baldeia (API + PostgreSQL)</text><rect x="1160" y="120" width="290" height="520" rx="22" fill="none" stroke="#9C7A06" stroke-width="2" stroke-dasharray="10 7"/><rect x="1180" y="108" width="232.79999999999998" height="24" rx="12" fill="#F6F3EC"/><text x="1190" y="125" font-size="12.5" font-weight="700" fill="#9C7A06" text-anchor="start">Ambiente de dados (pipeline)</text><rect x="1160" y="690" width="290" height="250" rx="22" fill="none" stroke="#16805A" stroke-width="2" stroke-dasharray="10 7"/><rect x="1180" y="678" width="88.39999999999999" height="24" rx="12" fill="#F6F3EC"/><text x="1190" y="695" font-size="12.5" font-weight="700" fill="#16805A" text-anchor="start">Terceiros</text><rect x="70" y="170" width="250" height="70" fill="#FFFFFF" stroke="#101418" stroke-width="2.2"/><text x="195.0" y="203.0" font-size="14" font-weight="600" fill="#101418" text-anchor="middle">Usuário</text><text x="195.0" y="222.0" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">passageiro(a)</text><rect x="70" y="300" width="250" height="120" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="70" y1="334" x2="320" y2="334" stroke="#C9CDD5"/><text x="88" y="323" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P0</text><text x="118" y="323" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Interface web</text><text x="88" y="354" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">React · sessão em cookie</text><text x="88" y="371" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">httpOnly; navegação offline</text><text x="88" y="388" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">em localStorage</text><rect x="70" y="480" width="250" height="70" fill="#FFFFFF" stroke="#101418" stroke-width="2.2"/><text x="195.0" y="513.0" font-size="14" font-weight="600" fill="#101418" text-anchor="middle">Geolocalização</text><text x="195.0" y="532.0" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">API do navegador, sob permissão</text><rect x="70" y="600" width="250" height="110" rx="14" fill="#E3EBFB" stroke="#2B59C3"/><text x="86" y="628" font-size="13" font-weight="700" fill="#2B59C3" text-anchor="start">Fica no aparelho</text><text x="86" y="652" font-size="11.5" font-weight="500" fill="#101418" text-anchor="start">• coordenadas GPS (nunca enviadas)</text><text x="86" y="670" font-size="11.5" font-weight="500" fill="#101418" text-anchor="start">• viagem em andamento (offline)</text><text x="86" y="688" font-size="11.5" font-weight="500" fill="#101418" text-anchor="start">• só a parada confirmada sobe</text><rect x="70" y="760" width="250" height="70" fill="#FFFFFF" stroke="#101418" stroke-width="2.2"/><text x="195.0" y="793.0" font-size="14" font-weight="600" fill="#101418" text-anchor="middle">Comunidade</text><text x="195.0" y="812.0" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">usuários que reportam</text><rect x="440" y="160" width="300" height="130" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="440" y1="194" x2="740" y2="194" stroke="#C9CDD5"/><text x="458" y="183" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P1</text><text x="488" y="183" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Autenticação e consentimento</text><text x="458" y="214" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">bcrypt · JWT · limites de tentativa</text><text x="458" y="231" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">consentimento por finalidade</text><text x="458" y="248" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">(log append-only)</text><rect x="780" y="160" width="300" height="130" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="780" y1="194" x2="1080" y2="194" stroke="#C9CDD5"/><text x="798" y="183" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P2</text><text x="828" y="183" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Planejamento de rotas</text><text x="798" y="214" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">grafo em memória (Gold)</text><text x="798" y="231" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">Dijkstra multicritério</text><text x="798" y="248" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">explica fatores e limitações</text><path d="M440 320 H740 M440 354 H740 M440 320 V354" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="440" y="320" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="450" y="342" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D1</text><text x="478" y="342" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Contas, preferências, consentimentos</text><circle cx="724" cy="337" r="6" fill="#FF4D2E"/><path d="M780 320 H1080 M780 354 H1080 M780 320 V354" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="780" y="320" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="790" y="342" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D2</text><text x="818" y="342" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Viagens e recomendações</text><circle cx="1064" cy="337" r="6" fill="#FF4D2E"/><path d="M780 376 H1080 M780 410 H1080 M780 376 V410" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="780" y="376" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="790" y="398" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D4</text><text x="818" y="398" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Rede de transporte (referência)</text><rect x="440" y="440" width="300" height="130" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="440" y1="474" x2="740" y2="474" stroke="#C9CDD5"/><text x="458" y="463" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P3</text><text x="488" y="463" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Comunidade e confiança</text><text x="458" y="494" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">remove dados pessoais do texto</text><text x="458" y="511" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">apoio × frescor; teto 0,85</text><text x="458" y="528" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">denúncia → moderação</text><rect x="780" y="440" width="300" height="130" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="780" y1="474" x2="1080" y2="474" stroke="#C9CDD5"/><text x="798" y="463" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P4</text><text x="828" y="463" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Privacidade e titular</text><text x="798" y="494" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">exportar (JSON), revogar,</text><text x="798" y="511" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">excluir conta (anonimiza relatos)</text><text x="798" y="528" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">retenção automática</text><path d="M440 600 H740 M440 634 H740 M440 600 V634" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="440" y="600" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="450" y="622" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D3</text><text x="478" y="622" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Relatos, votos e denúncias</text><circle cx="724" cy="617" r="6" fill="#FF4D2E"/><path d="M440 660 H740 M440 694 H740 M440 660 V694" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="440" y="660" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="450" y="682" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D6</text><text x="478" y="682" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Auditoria (IP só como hash)</text><circle cx="724" cy="677" r="6" fill="#FF4D2E"/><path d="M780 660 H1080 M780 694 H1080 M780 660 V694" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="780" y="660" width="300" height="34" fill="#FFFFFF" opacity="0.6"/><text x="790" y="682" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D5</text><text x="818" y="682" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Linhagem e qualidade (versões)</text><rect x="440" y="740" width="640" height="100" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="440" y1="774" x2="1080" y2="774" stroke="#C9CDD5"/><text x="458" y="763" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P5</text><text x="488" y="763" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Análise agregada e monitoramento</text><text x="458" y="794" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">k-anonimato (k=3) em agregados de relatos · métricas de latência · feedback das recomendações</text><text x="458" y="811" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">Sem venda ou compartilhamento de dados pessoais</text><rect x="1190" y="160" width="230" height="70" fill="#FFFFFF" stroke="#101418" stroke-width="2.2"/><text x="1305.0" y="193.0" font-size="14" font-weight="600" fill="#101418" text-anchor="middle">Fontes oficiais</text><text x="1305.0" y="212.0" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">SPTrans (GTFS)</text><rect x="1190" y="270" width="230" height="130" rx="26" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><line x1="1190" y1="304" x2="1420" y2="304" stroke="#C9CDD5"/><text x="1208" y="293" font-size="12" font-weight="700" fill="#FF4D2E" text-anchor="start">P6</text><text x="1238" y="293" font-size="13.5" font-weight="600" fill="#101418" text-anchor="start">Pipeline (Python)</text><text x="1208" y="324" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">Bronze → Silver → Gold</text><text x="1208" y="341" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">quarentena + relatório</text><text x="1208" y="358" font-size="11.5" font-weight="400" fill="#5B6270" text-anchor="start">_manifest.json</text><path d="M1190 440 H1420 M1190 474 H1420 M1190 440 V474" stroke="#101418" stroke-width="1.8" fill="none"/><rect x="1190" y="440" width="230" height="34" fill="#FFFFFF" opacity="0.6"/><text x="1200" y="462" font-size="11.5" font-weight="700" fill="#5B6270" text-anchor="start">D7</text><text x="1228" y="462" font-size="12.5" font-weight="600" fill="#101418" text-anchor="start">Arquivos Bronze/Silver/Gold</text><text x="1305" y="530" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="middle">Olho Vivo · EMTU · Metrô:</text><text x="1305" y="548" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="middle">planejadas</text><rect x="1190" y="730" width="230" height="70" fill="#FFFFFF" stroke="#101418" stroke-width="2.2"/><text x="1305.0" y="763.0" font-size="14" font-weight="600" fill="#101418" text-anchor="middle">OpenStreetMap</text><text x="1305.0" y="782.0" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">tiles do mapa (ODbL)</text><rect x="1190" y="840" width="230" height="70" fill="#FFFFFF" stroke="#5B6270" stroke-width="1.8" stroke-dasharray="6 5"/><text x="1305" y="870" font-size="13" font-weight="600" fill="#5B6270" text-anchor="middle">Overpass / Olho Vivo</text><text x="1305" y="889" font-size="11" font-weight="400" fill="#5B6270" text-anchor="middle">planejadas</text><path d="M195 240 L195 300" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="167.65" y="259" width="54.699999999999996" height="18" rx="9" fill="#F6F3EC"/><text x="195" y="272" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">cliques</text><path d="M320 205 L440 205" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><rect x="328.25" y="183" width="103.5" height="18" rx="9" fill="#F6F3EC"/><text x="380" y="196" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">● e-mail, senha</text><path d="M320 305 L760 305 L760 225 L780 225" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><rect x="477.75" y="287" width="164.5" height="18" rx="9" fill="#F6F3EC"/><text x="560" y="300" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">● origem/destino, horário</text><path d="M195 480 L195 420" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="143.25" y="442" width="103.5" height="18" rx="9" fill="#F6F3EC"/><text x="195" y="455" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">lat/lon (local)</text><path d="M320 795 L375 795 L375 505 L440 505" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><rect x="319.15" y="647" width="115.69999999999999" height="18" rx="9" fill="#F6F3EC"/><text x="377" y="660" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">● relato + parada</text><path d="M590 290 L590 320" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><path d="M930 290 L930 320" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><text x="944" y="312" font-size="11" font-weight="500" fill="#FF4D2E" text-anchor="start">● só com consentimento</text><path d="M590 570 L590 600" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><path d="M780 505 L740 505" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="726.55" y="477" width="66.9" height="18" rx="9" fill="#F6F3EC"/><text x="760" y="490" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">anonimiza</text><path d="M1080 390 L1100 390 L1100 225 L1080 225" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="1078.75" y="287" width="42.5" height="18" rx="9" fill="#F6F3EC"/><text x="1100" y="300" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">grafo</text><path d="M1305 230 L1305 270" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M1305 400 L1305 440" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M1190 457 L1140 457 L1140 405 L1080 405" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="1103.5" y="427" width="73.0" height="18" rx="9" fill="#F6F3EC"/><text x="1140" y="440" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">carga Gold</text><path d="M1140 457 L1140 677 L1080 677" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="1115.7" y="587" width="48.599999999999994" height="18" rx="9" fill="#F6F3EC"/><text x="1140" y="600" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">versão</text><path d="M1190 765 L1150 765 L1150 875 L345 875 L345 420 L320 420" fill="none" stroke="#16805A" stroke-width="1.8" marker-end="url(#a)"/><rect x="665.55" y="857" width="188.89999999999998" height="18" rx="9" fill="#F6F3EC"/><text x="760" y="870" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">imagens do mapa (com Referer)</text><path d="M760 694 L760 740" fill="none" stroke="#5B6270" stroke-width="1.8" marker-end="url(#m)"/><rect x="747.9" y="707" width="24.2" height="18" rx="9" fill="#F6F3EC"/><text x="760" y="720" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">lê</text><rect x="440" y="974" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#FF4D2E" stroke-width="2"/><text x="470" y="985" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">fluxo com dado pessoal</text><rect x="630" y="974" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#101418" stroke-width="2"/><text x="660" y="985" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">fluxo sem dado pessoal</text><rect x="820" y="974" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#5B6270" stroke-width="2" stroke-dasharray="5 4"/><text x="850" y="985" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">planejado</text></svg>
