<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" width="1480" height="900" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif"><title id="t">Pipeline de dados da Baldeia</title><desc id="d">Fluxo das fontes à apresentação: ingestão, camadas Bronze, Silver e Gold, armazenamento, análise, algoritmos, recomendações, apresentação, feedback e monitoramento.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#101418"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF4D2E"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6270"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F1F2F4"/><line x1="0" y1="0" x2="0" y2="8" stroke="#D5D8DE" stroke-width="3"/></pattern></defs><rect width="1480" height="900" fill="#F6F3EC"/><text x="40" y="52" font-size="26" font-weight="700" fill="#101418" text-anchor="start">Pipeline de dados — da fonte à decisão</text><text x="40" y="80" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">Versão do dataset: dsv_b944d5374b20_p1.1.0 · 54 verificações de qualidade · tempos medidos na última execução</text><g id="fontes" class="step" data-step="fontes" tabindex="0"><rect x="40" y="110" width="270" height="470" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="56" y="136" font-size="15" font-weight="600" fill="#101418" text-anchor="start">1 · Fontes</text></g><rect x="56" y="150" width="238" height="56" rx="10" fill="#E3EBFB" stroke="#2B59C3" stroke-width="1.6"/><text x="70" y="174" font-size="13" font-weight="600" fill="#101418" text-anchor="start">GTFS SPTrans (amostra)</text><text x="70" y="193" font-size="11.5" font-weight="500" fill="#2B59C3" text-anchor="start">integrada · histórica</text><rect x="56" y="220" width="238" height="56" rx="10" fill="#E3EBFB" stroke="#2B59C3" stroke-width="1.6" stroke-dasharray="6 5"/><text x="70" y="244" font-size="13" font-weight="600" fill="#101418" text-anchor="start">GTFS completo / Olho Vivo</text><text x="70" y="263" font-size="11.5" font-weight="500" fill="#2B59C3" text-anchor="start">planejada · requer cadastro</text><rect x="56" y="290" width="238" height="56" rx="10" fill="#DDF3E8" stroke="#16805A" stroke-width="1.6"/><text x="70" y="314" font-size="13" font-weight="600" fill="#101418" text-anchor="start">OpenStreetMap (tiles)</text><text x="70" y="333" font-size="11.5" font-weight="500" fill="#16805A" text-anchor="start">integrada · ODbL</text><rect x="56" y="360" width="238" height="56" rx="10" fill="#FFE6DE" stroke="#D9431F" stroke-width="1.6"/><text x="70" y="384" font-size="13" font-weight="600" fill="#101418" text-anchor="start">Relatos da comunidade</text><text x="70" y="403" font-size="11.5" font-weight="500" fill="#D9431F" text-anchor="start">integrada · não verificados</text><rect x="56" y="430" width="238" height="56" rx="10" fill="#ECE6FB" stroke="#6B4BD1" stroke-width="1.6"/><text x="70" y="454" font-size="13" font-weight="600" fill="#101418" text-anchor="start">Uso da plataforma</text><text x="70" y="473" font-size="11.5" font-weight="500" fill="#6B4BD1" text-anchor="start">integrada · com consentimento</text><rect x="56" y="500" width="238" height="56" rx="10" fill="#ECE6FB" stroke="#6B4BD1" stroke-width="1.6"/><text x="70" y="524" font-size="13" font-weight="600" fill="#101418" text-anchor="start">Geolocalização</text><text x="70" y="543" font-size="11.5" font-weight="500" fill="#6B4BD1" text-anchor="start">só no aparelho · não enviada</text><g id="ingestao" class="step" data-step="ingestao" tabindex="0"><rect x="350" y="110" width="250" height="150" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="366" y="136" font-size="15" font-weight="600" fill="#101418" text-anchor="start">2 · Ingestão</text><text x="366" y="158.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">bronze.py</text><text x="366" y="177.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• cópia íntegra + SHA-256</text><text x="366" y="196.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• horário, origem, nº de linhas</text><text x="366" y="215.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• 11 ms</text></g><g id="bronze" class="step" data-step="bronze" tabindex="0"><rect x="350" y="290" width="250" height="170" rx="14" fill="#F7E8D8" stroke="#A8642B" stroke-width="1.6"/><text x="366" y="316" font-size="15" font-weight="600" fill="#A8642B" text-anchor="start">3 · Bronze (bruto)</text><text x="366" y="338.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">data/bronze/&lt;fonte&gt;/&lt;job&gt;/</text><text x="366" y="357.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• raw.zip + .txt originais</text><text x="366" y="376.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• _ingestion.json</text><text x="366" y="395.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• imutável: permite reprocessar</text></g><g id="silver" class="step" data-step="silver" tabindex="0"><rect x="640" y="110" width="290" height="350" rx="14" fill="#ECEFF4" stroke="#5F6B7E" stroke-width="1.6"/><text x="656" y="136" font-size="15" font-weight="600" fill="#5F6B7E" text-anchor="start">4–5 · Silver (limpo e validado)</text><text x="656" y="158.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">silver.py</text><text x="656" y="177.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• remove duplicadas e PK repetidas</text><text x="656" y="196.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• tipa coordenadas e horários (&gt;24h)</text><text x="656" y="215.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• valida domínios (route_type, cores)</text><text x="656" y="234.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• integridade referencial (FK)</text><text x="656" y="253.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• vigência do calendário</text><text x="656" y="272.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• alerta: fora da RMSP</text><text x="656" y="291.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start"></text><text x="656" y="310.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">54 regras · 3 com ressalvas</text><text x="656" y="329.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">119 ms</text></g><g id="quarentena" class="step" data-step="quarentena" tabindex="0"><rect x="640" y="490" width="290" height="90" rx="14" fill="url(#hatch)" stroke="#5F6B7E" stroke-width="1.6" stroke-dasharray="6 5"/><text x="656" y="516" font-size="15" font-weight="600" fill="#101418" text-anchor="start">Quarentena</text><text x="656" y="538.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">_quarentena/&lt;tabela&gt;.csv</text><text x="656" y="557.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">nada é descartado sem motivo</text></g><g id="gold" class="step" data-step="gold" tabindex="0"><rect x="970" y="110" width="300" height="350" rx="14" fill="#FBF0C9" stroke="#9C7A06" stroke-width="1.6"/><text x="986" y="136" font-size="15" font-weight="600" fill="#9C7A06" text-anchor="start">6 · Gold (integrado)</text><text x="986" y="158.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">gold.py</text><text x="986" y="177.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• trechos parada→parada</text><text x="986" y="196.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">  (tempo, distância, velocidade)</text><text x="986" y="215.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• conexões a pé ≤ 400 m</text><text x="986" y="234.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• traçados simplificados (Douglas–Peucker)</text><text x="986" y="253.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• imputação sinalizada</text><text x="986" y="272.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• anomalias: z-score robusto</text><text x="986" y="291.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start"></text><text x="986" y="310.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">_manifest.json = linhagem</text><text x="986" y="329.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">160 ms</text></g><g id="armazenamento" class="step" data-step="armazenamento" tabindex="0"><rect x="1310" y="110" width="140" height="350" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="1326" y="136" font-size="15" font-weight="600" fill="#101418" text-anchor="start">7 · Banco</text><text x="1326" y="158.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">armazena-</text><text x="1326" y="177.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">mento</text><text x="1326" y="196.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start"></text><text x="1326" y="215.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">PostgreSQL</text><text x="1326" y="234.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">(PGlite local)</text><text x="1326" y="253.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start"></text><text x="1326" y="272.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">loadGold.ts</text><text x="1326" y="291.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">versão ativa</text><text x="1326" y="310.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start"></text><text x="1326" y="329.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">PostGIS</text><text x="1326" y="348.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">opcional</text></g><g id="analise" class="step" data-step="analise" tabindex="0"><rect x="1110" y="640" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="1126" y="666" font-size="15" font-weight="600" fill="#101418" text-anchor="start">8 · Análise</text><text x="1126" y="688.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">analysis.py + views SQL</text><text x="1126" y="707.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• estatística descritiva</text><text x="1126" y="726.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• oferta planejada por hora</text><text x="1126" y="745.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• agregados com k-anonimato (k=3)</text></g><g id="algoritmos" class="step" data-step="algoritmos" tabindex="0"><rect x="730" y="640" width="340" height="150" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="746" y="666" font-size="15" font-weight="600" fill="#101418" text-anchor="start">9 · Modelos e algoritmos</text><text x="746" y="688.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">planner.ts · trust.ts</text><text x="746" y="707.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• Dijkstra multicritério por horário</text><text x="746" y="726.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• confiança de relatos (regras)</text><text x="746" y="745.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• sem ML: dados insuficientes</text></g><g id="recomendacoes" class="step" data-step="recomendacoes" tabindex="0"><rect x="390" y="640" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="406" y="666" font-size="15" font-weight="600" fill="#101418" text-anchor="start">10 · Recomendações</text><text x="406" y="688.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">alternativas + motivos</text><text x="406" y="707.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• mais rápida, menos baldeações…</text><text x="406" y="726.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• critério sem dados = avisado</text><text x="406" y="745.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• tabela recommendations</text></g><g id="apresentacao" class="step" data-step="apresentacao" tabindex="0"><rect x="40" y="640" width="310" height="150" rx="14" fill="#FFFFFF" stroke="#101418" stroke-width="1.6"/><text x="56" y="666" font-size="15" font-weight="600" fill="#101418" text-anchor="start">11 · Apresentação</text><text x="56" y="688.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">planejador, mapa, alertas,</text><text x="56" y="707.0" font-size="12.5" font-weight="400" fill="#5B6270" text-anchor="start">navegação, relatórios</text><text x="56" y="726.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• origem do dado sempre visível</text><text x="56" y="745.0" font-size="12.5" font-weight="400" fill="#101418" text-anchor="start">• demo sempre rotulado</text></g><g id="monitoramento" class="step" data-step="monitoramento" tabindex="0"><rect x="40" y="820" width="1410" height="56" rx="14" fill="#FFF4EF" stroke="#FF4D2E" stroke-width="1.6"/><text x="56" y="846" font-size="15" font-weight="600" fill="#FF4D2E" text-anchor="start">12 · Feedback e monitoramento</text></g><text x="370" y="853" font-size="12.5" font-weight="500" fill="#5B6270" text-anchor="start">útil/não útil · quality_checks por versão · ingestion_jobs · latência p50/p95 · denúncias e moderação · retenção automática</text><path d="M310 185 L350 185" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M475 260 L475 290" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M600 375 L640 375" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="595.7" y="349" width="48.599999999999994" height="18" rx="9" fill="#F6F3EC"/><text x="620" y="362" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">valida</text><path d="M785 460 L785 490" fill="none" stroke="#5B6270" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m)"/><path d="M930 285 L970 285" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="922.65" y="259" width="54.699999999999996" height="18" rx="9" fill="#F6F3EC"/><text x="950" y="272" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">integra</text><path d="M1270 285 L1310 285" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M1380 460 L1380 640" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><rect x="1364.85" y="547" width="30.299999999999997" height="18" rx="9" fill="#F6F3EC"/><text x="1380" y="560" font-size="11" font-weight="500" fill="#5B6270" text-anchor="middle">SQL</text><path d="M1110 715 L1070 715" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M730 715 L690 715" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M390 715 L350 715" fill="none" stroke="#101418" stroke-width="1.8" marker-end="url(#a)"/><path d="M195 790 L195 820" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><path d="M1300 820 L1300 800 L1300 790" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><path d="M700 820 L700 805 L785 805 L785 790" fill="none" stroke="#FF4D2E" stroke-width="1.8" marker-end="url(#s)"/><path d="M40 848 H20 V140 H40" fill="none" stroke="#FF4D2E" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#s)"/><text x="0" y="0" transform="translate(15 500) rotate(-90)" font-size="11" font-weight="600" fill="#FF4D2E" text-anchor="middle">reprocessa</text><rect x="360" y="599" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#A8642B" stroke-width="2"/><text x="390" y="610" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">Bronze: como chegou</text><rect x="550" y="599" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#5F6B7E" stroke-width="2"/><text x="580" y="610" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">Silver: tratado</text><rect x="740" y="599" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#9C7A06" stroke-width="2"/><text x="770" y="610" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">Gold: pronto p/ uso</text><rect x="930" y="599" width="22" height="14" rx="4" fill="#FFFFFF" stroke="#5B6270" stroke-width="2" stroke-dasharray="5 4"/><text x="960" y="610" font-size="11.5" font-weight="500" fill="#5B6270" text-anchor="start">planejado/quarentena</text></svg>
